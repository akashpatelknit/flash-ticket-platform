spring.application.name=booking-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${BOOKING_DB_HOST:localhost}:${BOOKING_DB_PORT:5442}/${BOOKING_DB_NAME:booking_db}
spring.datasource.username=${BOOKING_DB_USER:booking_user}
spring.datasource.password=${BOOKING_DB_PASSWORD:change_me_booking}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
