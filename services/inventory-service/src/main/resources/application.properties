spring.application.name=inventory-service
server.port=8082

spring.datasource.url=jdbc:postgresql://${INVENTORY_DB_HOST:localhost}:${INVENTORY_DB_PORT:5441}/${INVENTORY_DB_NAME:inventory_db}
spring.datasource.username=${INVENTORY_DB_USER:inventory_user}
spring.datasource.password=${INVENTORY_DB_PASSWORD:change_me_inventory}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false